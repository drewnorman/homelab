# sops-nix secret encryption configuration.
# Run all sops commands from the nix/ directory (where this file lives).
#
# Setup workflow:
#   1. Install tools: nix shell nixpkgs#age nixpkgs#ssh-to-age
#   2. Get your operator age recipient: ssh-to-age < ~/.ssh/drew@x1c-g9.pub
#      To edit encrypted files, provide the derived private identity at runtime:
#      SOPS_AGE_KEY_CMD='ssh-to-age -private-key -i /home/drew/.ssh/drew@x1c-g9' sops secrets/frigate.yaml
#   3. After `tofu apply`, get lab-core's age key:
#        ssh-keyscan -t ed25519 <HOST_IP> | ssh-to-age
#   4. Replace the lab-core recipient below if the host key changes.
#   5. Create and encrypt each secrets file (from nix/):
#        sops secrets/edge.yaml
#        sops secrets/lldap.yaml
#        sops secrets/authelia.yaml
#        sops secrets/bazarr.yaml
#        sops secrets/frigate.yaml
#   6. To re-encrypt after adding a new host key (from nix/):
#        sops updatekeys secrets/<file>.yaml

keys:
  # Operator — can decrypt any secret file for editing
  # ssh-to-age < ~/.ssh/drew@x1c-g9.pub
  - &operator age18j3zdckfwd96muuayfey4r4gfqsf0r6wwq8gd6jjccqhjegj7pzscknx3g

  # Active host key — obtained after first `tofu apply`:
  #   ssh-keyscan -t ed25519 <IP> | ssh-to-age
  - &lab-core        age1aaa4zalk4j8emsg2gyhm8jc4x9stv7rz3va99lfnvaf25y0x8p3swrj3mv

creation_rules:
  # OpenAI organization admin credentials are operator-only. Unlike runtime
  # secrets, lab-core must never receive a recipient slot for this file.
  - path_regex: secrets/openai-admin\.yaml$
    key_groups:
      - age: [*operator]

  # Camera administrator access is operator-only; Frigate needs RTSP access only.
  - path_regex: secrets/thingino\.yaml$
    key_groups:
      - age: [*operator]

  - path_regex: secrets/edge\.yaml$
    key_groups:
      - age: [*operator, *lab-core]

  - path_regex: secrets/lldap\.yaml$
    key_groups:
      - age: [*operator, *lab-core]

  - path_regex: secrets/authelia\.yaml$
    key_groups:
      - age: [*operator, *lab-core]

  - path_regex: secrets/bazarr\.yaml$
    key_groups:
      - age: [*operator, *lab-core]

  - path_regex: secrets/open-webui\.yaml$
    key_groups:
      - age: [*operator, *lab-core]

  - path_regex: secrets/youtube\.yaml$
    key_groups:
      - age: [*operator, *lab-core]

  - path_regex: secrets/cat-tv-status\.yaml$
    key_groups:
      - age: [*operator, *lab-core]

  - path_regex: secrets/frigate\.yaml$
    key_groups:
      - age: [*operator, *lab-core]

  - path_regex: secrets/mqtt\.yaml$
    key_groups:
      - age: [*operator, *lab-core]

  - path_regex: secrets/household-(automations|status)\.enc$
    key_groups:
      - age: [*operator, *lab-core]
